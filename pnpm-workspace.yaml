packages:
  - server
  - admin

# 每个子项目使用自己的 node_modules/.pnpm 和 lockfile。
# @cool-midway/core 通过自身所在的 node_modules 路径推算后端运行目录（<项目>/dist），
# 依赖若统一放在仓库根目录的 node_modules 下，会推算成错误的目录导致模块无法加载。
sharedWorkspaceLockfile: false

# 允许执行安装脚本的依赖（pnpm 默认禁止依赖的 postinstall）
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  es5-ext: true
  esbuild: true
  msgpackr-extract: false
  vue-demi: true

# 依赖补丁（pnpm patch 生成，补丁文件在 patches/）
# @cool-vue/vite-plugin：去掉生成 eps 时对 /admin/dict/info/types 的请求，本框架后端没有 dict 模块
patchedDependencies:
  '@cool-vue/vite-plugin@8.2.20': patches/@cool-vue__vite-plugin@8.2.20.patch

# 每个子项目各用一份 lockfile，补丁只在用到它的子项目中生效，其他子项目安装时不报「补丁未使用」
allowUnusedPatches: true
