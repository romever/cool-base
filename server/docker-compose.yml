# 本地数据库环境
# 数据存放在当前目录下的 data里
# 推荐使用安装了docker扩展的vscode打开目录 在本文件上右键可以快速启动，停止
# 如不需要相关容器开机自启动，可注释掉 restart: always
# 如遇端口冲突 可调整ports下 :前面的端口号
version: "3.1"

services:
  coolDB:
    image: postgres:16
    restart: always
    volumes:
      - ./data/postgres/:/var/lib/postgresql/data/
    environment:
      TZ: Asia/Shanghai # 指定时区
      POSTGRES_USER: "postgres" # 用户名
      POSTGRES_PASSWORD: "123456" # 密码
      POSTGRES_DB: "cool" # 业务库名
    networks:
      - cool
    ports:
      - 5432:5432

  coolRedis:
    image: redis
    #command: --requirepass "12345678" # redis库密码,不需要密码注释本行
    restart: always
    environment:
      TZ: Asia/Shanghai # 指定时区
    volumes:
      - ./data/redis/:/data/
    networks:
      - cool
    ports:
      - 6379:6379
